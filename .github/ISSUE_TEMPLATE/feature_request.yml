name: Feature
description: Propose a feature or a scope improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        BeeBranch has a controlled scope: local-first, a single Git CLI engine,
        no AI, no telemetry, no proprietary cloud. A request outside that frame
        must first be discussed here.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the real need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Expected behavior, flow, known limits.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, other clients, scripts.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area concerned
      options:
        - Graph and history
        - Status / diff / commit
        - Branches, merge, rebase, conflicts
        - Sync / remote
        - Stash, tags, worktrees, submodules, patches
        - GitLab
        - GitHub
        - Workspaces and multi-repository
        - Interface and accessibility
        - Distribution and updates
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The request stays local-first and requires neither an editor account nor telemetry.
          required: true
        - label: I have checked that the feature does not already exist in the latest release.
          required: true
