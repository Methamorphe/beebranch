name: Fonctionnalité
description: Proposer une fonctionnalité ou une amélioration du périmètre
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        BeeBranch a un périmètre contrôlé : local-first, un seul moteur Git CLI,
        pas d'IA, pas de télémétrie, pas de cloud propriétaire. Une demande qui
        sort de ce cadre doit d'abord être discutée ici.
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Décrivez le besoin réel, pas la solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
      description: Comportement attendu, parcours, limites connues.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
      description: Contournements actuels, autres clients, scripts.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Graphe et historique
        - Status / diff / commit
        - Branches, merge, rebase, conflits
        - Sync / remote
        - Stash, tags, worktrees, sous-modules, patchs
        - GitLab
        - GitHub
        - Workspaces et multi-dépôts
        - Interface et accessibilité
        - Distribution et mises à jour
        - Autre
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Périmètre
      options:
        - label: La demande reste local-first et n'exige ni compte éditeur, ni télémétrie.
          required: true
        - label: J'ai vérifié que la fonctionnalité n'existe pas déjà dans la dernière release.
          required: true
