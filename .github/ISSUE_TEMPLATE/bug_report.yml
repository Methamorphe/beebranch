name: Bug
description: Report incorrect behavior or a regression
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check that an issue does not already cover the problem.
        **Never** include a token, a private key or personal data.
        For a vulnerability, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: BeeBranch version
      description: Visible in Settings, or in the output of `beebranch --version`.
      placeholder: "0.7.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`.
      placeholder: "git version 2.55.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest deterministic path to the problem.
      placeholder: |
        1. Open a repository …
        2. Click on …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: Output, error message or screenshot. Redact personal paths and secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Settings → Logs, or `~/Library/Logs/BeeBranch` / `%LOCALAPPDATA%\\BeeBranch\\logs`.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have checked that the latest release still reproduces the problem.
          required: true
        - label: This report contains no secret and no personal data.
          required: true
