name: Bug
description: Signaler un comportement incorrect ou une régression
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de vérifier qu'une issue ne traite pas déjà le problème.
        N'incluez **jamais** de token, de clé privée ou de donnée personnelle.
        Pour une vulnérabilité, n'ouvrez pas d'issue : voir SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version de BeeBranch
      description: Visible dans Réglages, ou sortie de `beebranch --version`.
      placeholder: "0.7.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Version de Git
      description: Sortie de `git --version`.
      placeholder: "git version 2.55.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Le plus court chemin déterministe vers le problème.
      placeholder: |
        1. Ouvrir un dépôt …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Sortie, message d'erreur ou capture. Redactez chemins personnels et secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux ou captures
      description: Réglages → Journaux, ou `~/Library/Logs/BeeBranch` / `%LOCALAPPDATA%\\BeeBranch\\logs`.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: J'ai vérifié que la dernière release reproduit encore le problème.
          required: true
        - label: Ce rapport ne contient ni secret ni donnée personnelle.
          required: true
