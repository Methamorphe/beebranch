name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public repository that carries the signed artifacts and manifests; the
  # source repository stays private. Clients only ever read this one.
  RELEASES_REPO: Methamorphe/beebranch-releases

jobs:
  build:
    name: Package and sign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: darwin-aarch64
          - os: ubuntu-22.04
            platform: linux
            target: linux-x86_64
          - os: windows-latest
            platform: windows
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Apple/Windows code-signing credentials are optional. Without them the
      # bundle is unsigned (Gatekeeper/SmartScreen warn on first launch) but
      # the updater signature below stays mandatory.
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.TAURI_WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # `option_env!` is invisible to cargo, so the update host is part of
          # the cache key: a cache hit must never restore a binary built for
          # another endpoint.
          key: ${{ matrix.target }}-${{ github.repository }}-v1

      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-no-telemetry.mjs

      # Secrets arrive as empty strings when unset, and Tauri treats a present
      # but empty APPLE_CERTIFICATE as a PKCS#12 and fails to import it. Export
      # only the credentials that actually have a value; the updater key is
      # mandatory and checked here.
      - name: Export signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_SECRET: ${{ secrets.TAURI_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.TAURI_WINDOWS_CERTIFICATE_PASSWORD }}
          UPDATER_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          export_if_present() {
            if [ -n "$2" ]; then
              printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
            fi
          }
          export_if_present APPLE_CERTIFICATE "$APPLE_CERTIFICATE_SECRET"
          export_if_present APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_SECRET"
          export_if_present APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY_SECRET"
          export_if_present APPLE_ID "$APPLE_ID_SECRET"
          export_if_present APPLE_PASSWORD "$APPLE_PASSWORD_SECRET"
          export_if_present APPLE_TEAM_ID "$APPLE_TEAM_ID_SECRET"
          export_if_present TAURI_WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE_SECRET"
          export_if_present TAURI_WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD_SECRET"
          export_if_present TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY_SECRET"
          export_if_present TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_KEY_PASSWORD_SECRET"
          if [ -z "$UPDATER_KEY_SECRET" ]; then
            echo "::error title=Clé de signature absente::TAURI_SIGNING_PRIVATE_KEY n'est pas configuré ; aucun artefact ne serait installable."
            exit 1
          fi

      # Tauri verifies the updater signature at install time. The private key
      # never enters the repository; it comes from an environment secret.
      - name: Build, sign and bundle
        env:
          # Single source of the update endpoint: the `latest.json` asset of
          # the newest non-draft, non-prerelease release of the public mirror.
          BEEBRANCH_UPDATE_ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
        run: npm run tauri build

      - name: Install smoke (macOS)
        if: matrix.platform == 'macos'
        run: |
          dmg=$(find target/release/bundle/dmg -name '*.dmg' | head -1)
          test -n "$dmg"
          mountpoint=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mountpoint" >/dev/null
          app=$(find "$mountpoint" -maxdepth 1 -name '*.app' | head -1)
          binary=$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)
          test -n "$binary"
          "$binary" --version
          hdiutil detach "$mountpoint" >/dev/null

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app=$(find target/release/bundle -name 'BeeBranch.app' -type d | head -1)
          test -n "$app"
          find target/release/bundle -name '*.sig' -size +0c | grep -q .
          if [ "$APPLE_SIGNING_ENABLED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
          else
            echo "::warning title=Signature Apple absente::Build macOS non signé et non notarié — Gatekeeper exigera une autorisation manuelle au premier lancement."
          fi

      - name: Install smoke (Linux)
        if: matrix.platform == 'linux'
        run: |
          deb=$(find target/release/bundle/deb -name '*.deb' | head -1)
          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          binary=$(find "$root" -type f -name beebranch -perm -u+x | head -1)
          test -n "$binary"
          "$binary" --version

      - name: Verify Windows signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer" }
          if (-not (Get-ChildItem target/release/bundle -Recurse -Filter *.sig)) { throw "no updater signature" }
          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "unsigned installer: $($signature.Status)" }
          } else {
            Write-Host "::warning title=Certificat Windows absent::Installateur non signé — SmartScreen avertira les utilisateurs."
          }

      - name: Install smoke (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer" }
          $target = Join-Path $env:RUNNER_TEMP "BeeBranch-install"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer failed: $($process.ExitCode)" }
          $binary = Get-ChildItem $target -Recurse -Filter "BeeBranch.exe" | Select-Object -First 1
          if (-not $binary) { throw "installed binary missing" }
          & $binary.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "installed binary did not start" }

      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        run: |
          deb=$(find target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$deb"
          dpkg-deb --info "$deb"
          rpm=$(find target/release/bundle/rpm -name '*.rpm' | head -1 || true)
          if [ -n "$rpm" ]; then rpm -qip "$rpm"; fi
          find target/release/bundle -name '*.sig' -size +0c | grep -q .

      - name: Build per-platform update manifest fragment
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          node scripts/update-manifest.mjs \
            --dir target/release/bundle \
            --target "${{ matrix.target }}" \
            --version "$version" \
            --base-url "https://github.com/${RELEASES_REPO}/releases/download/$tag" \
            --notes "docs/releases/${version}.md" \
            --out "target/update/fragments/${{ matrix.target }}.json"

      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Upload manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: target/update/fragments/${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    name: Publish signed manifest and rollback
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: target/release/bundle
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: target/update/fragments
          merge-multiple: true

      - name: Require the release mirror token
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "::error title=RELEASE_REPO_TOKEN manquant::Créez un PAT fine-grained (Contents: Read and write sur ${RELEASES_REPO}) puis : gh secret set RELEASE_REPO_TOKEN --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Collect previous manifest for rollback
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          previous=$(gh release list --repo "$RELEASES_REPO" --limit 2 --json tagName --jq '.[1].tagName // empty')
          if [ -n "$previous" ] && [ "$previous" != "$tag" ]; then
            gh release download "$previous" --repo "$RELEASES_REPO" --pattern latest.json --dir target/update/previous --clobber || true
          fi

      - name: Build latest.json and rollback.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          notes="docs/releases/${version}.md"
          extra=()
          if [ -f target/update/previous/latest.json ]; then
            extra+=(--rollback target/update/previous/latest.json)
          fi
          node scripts/merge-manifests.mjs \
            --dir target/update/fragments \
            --version "$version" \
            --notes "$notes" \
            --out target/update/latest.json \
            "${extra[@]}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          files=$(find target/release/bundle -type f \( -name '*.sig' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \))
          rollback=""
          if [ -f target/update/rollback.json ]; then rollback="target/update/rollback.json"; fi
          gh release create "$tag" \
            --repo "$RELEASES_REPO" \
            --title "BeeBranch $version" \
            --notes-file "docs/releases/${version}.md" \
            target/update/latest.json $rollback $files
