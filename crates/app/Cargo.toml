[package]
name = "beebranch-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
beebranch-core = { path = "../core" }
beebranch-git = { path = "../git" }
beebranch-gitlab = { path = "../gitlab" }
beebranch-github = { path = "../github" }
beebranch-store = { path = "../store" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# `ShellExecuteW` opens an https URL with the registered browser handler; the
# `explorer` binary instead parses its arguments as shell items.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
minisign-verify = "0.3.0"
tempfile.workspace = true
